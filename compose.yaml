services:
  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: lommebok
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD:-}
      MYSQL_ALLOW_EMPTY_PASSWORD: ${MYSQL_ALLOW_EMPTY_PASSWORD:-yes}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
    environment:
      DATABASE_URL: jdbc:mysql://database:3306/lommebok
      DATABASE_USERNAME: ${DATABASE_USERNAME:-root}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET}
      BRAPI_TOKEN: ${BRAPI_TOKEN}
    ports:
      - "8081:8080"
    depends_on:
      database:
        condition: service_healthy

volumes:
  mysql_data:
